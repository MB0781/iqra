# Construit, vérifie et publie le site sur GitHub Pages.
# - Sur une pull request : construction + tests (sans publication).
# - Sur un push vers main : construction + tests + publication.
name: Construction et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitaires
        run: npm test
      - name: Construction (astro check + build)
        run: npm run build
      - name: Vérification Tanzil, contenus, manifeste audio
        run: npm run verifier
      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium
      - name: Parcours, accessibilité, fonctions
        run: npx playwright test --workers=2
      - name: Lighthouse
        run: npx lhci autorun
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - id: deploiement
        uses: actions/deploy-pages@v4
